version: '3.8'

services:
  frontend:
    image: divakar777/email-frontend:latest
    env_file:
      - ./frontend/.env
    ports:
      - "3001:80"

  backend:
    image: divakar777/email-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8081:8081"

  web-socket:
    image: divakar777/email-websocket:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c","bun run socket"]
    env_file:
      - ./backend/.env
    ports:
      - "4001:4000"

  postgres:
    image: postgres:15-alpine
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=mysupersecretpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      timeout: 5s

  redis:
    image: redis:6.2-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
